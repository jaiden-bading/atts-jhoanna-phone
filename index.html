
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  <!-- page config -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside Jhoanna's phone</title>
  <style>                /* iPhone style */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #20232b;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }
    .phone {            /* for phone frame */
      width: min(390px, 96vw);
      height: min(820px, 94dvh);
      min-height: 540px;
      background: #090909;
      border: 7px solid #333;
      border-radius: 48px;
      padding: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 80px #0009;
    }
    .screen {          /* phone screen */
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(160deg, #536c83, #263747 48%, #171c29);
    }
    .status {          /* phone status bar */
      height: 42px;
      padding: 12px 25px 0;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      position: relative;
      z-index: 5;
    }
    .dynamic-island {    /* iPhone dynamic island for later versions haha */
      position: absolute;
      width: 105px;
      height: 27px;
      border-radius: 20px;
      background: black;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
    }
    .lock, .home, .app {      /* positioning */
      position: absolute;
      inset: 42px 0 0;
    }    
    .lock {                   /* lock screen */
      text-align: center;
      padding-top: 75px;
      background: linear-gradient(160deg, #607d95aa, #11182755);
    }
    .date {                  /* date */
      font-size: 16px;
    }
    .clock {                  /* setting the time */
      font-size: 76px;
      font-weight: 300;
      letter-spacing: -4px;
      margin-top: 8px;
    }
    .unlock {
      position: absolute;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid #ffffff88;
      border-radius: 30px;
      background: #ffffff22;
      color: white;
      padding: 12px 26px;
      font-size: 14px;
      cursor: pointer;
    }

    /* =====================================
       4. HOME SCREEN
       ===================================== */

    .home {
      display: none;
      padding: 22px 17px 65px;
      background: linear-gradient(150deg, #596c7d, #273647 55%, #171e2c);
    }

    .welcome {
      font-size: 14px;
      margin: 10px 3px 24px;
    }

    /* App icon arrangement */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px 10px;
    }

    .app-icon {
      border: 0;
      background: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Individual app icons */
    .emoji {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 29px;
      background: #ffffff25;
      box-shadow: 0 3px 9px #0003;
      backdrop-filter: blur(12px);
    }

    /* =====================================
       5. BOTTOM APP DOCK
       ===================================== */

    .dock {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 85px;
      border-radius: 25px;
      background: #ffffff25;
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    /* =====================================
       6. APPLICATION WINDOWS
       ===================================== */

    .app {
      display: none;
      background: #f5f5f7;
      color: #161616;
      padding: 20px;
      overflow-y: auto;
      z-index: 3;
    }

    .app h2 {
      font-size: 27px;
    }

    .app button {
      cursor: pointer;
      border: 0;
    }

    /* Back navigation button */
    .back {
      color: #287bea;
      background: none;
      font-size: 15px;
      padding: 8px 0;
    }

    /* Message bubbles */
    .chat {
      background: white;
      border-radius: 14px;
      padding: 12px;
      margin: 10px 0;
      font-size: 14px;
    }

    /* Notes appearance */
    .note {
      background: #fff4bb;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* Photos gallery */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .photo {
      height: 135px;
      border-radius: 12px;
      background: linear-gradient(140deg, #9aaaba, #43586c);
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    /* Bottom home indicator */
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 4px;
      background: white;
      border-radius: 5px;
      z-index: 10;
      cursor: pointer;
    }

    /* Responsive layout for shorter screens */
    @media (max-height: 650px) {
      .home {
        padding-top: 10px;
      }

      .grid {
        gap: 12px 8px;
      }

      .emoji {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       7. IPHONE DEVICE FRAME
       ===================================== -->

  <div class="phone">
    <div class="screen">

      <!-- Dynamic Island -->
      <div class="dynamic-island"></div>

      <!-- Status bar with time and indicators -->
      <div class="status">
        <span id="statusTime">9:41</span>
        <span>●●● Wi-Fi ▰</span>
      </div>

      <!-- =================================
           8. LOCK SCREEN
           ================================= -->

      <section class="lock" id="lock">

        <!-- Lock screen date -->
        <div class="date">Wednesday, November 5</div>

        <!-- Lock screen clock -->
        <div class="clock" id="clock">9:41</div>

        <!-- Unlock button -->
        <button class="unlock" onclick="unlockPhone()">
          Swipe up to unlock ↑
        </button>

      </section>

      <!-- =================================
           9. HOME SCREEN
           ================================= -->

      <section class="home" id="home">

        <div class="welcome">Good morning ☁️</div>

        <!-- Application icons -->
        <div class="grid">

          <button class="app-icon" onclick="openApp('messages')">
            <span class="emoji">💬</span>
            Messages
          </button>

          <button class="app-icon" onclick="openApp('photos')">
            <span class="emoji">🌄</span>
            Photos
          </button>

          <button class="app-icon" onclick="openApp('notes')">
            <span class="emoji">📝</span>
            Notes
          </button>

          <button class="app-icon" onclick="openApp('music')">
            <span class="emoji">🎵</span>
            Music
          </button>

          <button class="app-icon" onclick="openApp('social')">
            <span class="emoji">📷</span>
            Social
          </button>

          <button class="app-icon" onclick="openApp('calendar')">
            <span class="emoji">📅</span>
            Calendar
          </button>

          <button class="app-icon" onclick="openApp('settings')">
            <span class="emoji">⚙️</span>
            Settings
          </button>

        </div>

        <!-- Bottom dock -->
        <div class="dock">

          <button class="app-icon" onclick="openApp('messages')">
            <span class="emoji">💬</span>
          </button>

          <button class="app-icon" onclick="openApp('photos')">
            <span class="emoji">📸</span>
          </button>

          <button class="app-icon" onclick="openApp('music')">
            <span class="emoji">🎧</span>
          </button>

        </div>

      </section>

      <!-- =================================
           10. APPLICATION WINDOW
           ================================= -->

      <section class="app" id="app">

        <!-- Return to home screen -->
        <button class="back" onclick="goHome()">
          ‹ Home
        </button>

        <!-- Application content gets inserted here -->
        <div id="appContent"></div>

      </section>

      <!-- Bottom home indicator -->
      <div class="home-indicator" onclick="goHome()"></div>

    </div>
  </div>


  <!-- =======================================
       11. JAVASCRIPT: CHARACTER INFORMATION
       Customize the fictional character here.
       ======================================= -->

  <script>

    // Character profile and fictional phone content
    const character = {

      // Character's name
      name: "Alex",

      // Sample text conversations
      messages: [
        ["Jamie", "Are you awake?"],
        ["Alex", "Unfortunately."],
        ["Jamie", "We need to talk."],
        ["Alex", "About what?"],
        ["Jamie", "You know exactly what."]
      ],

      // Character's personal notes
      notes: `Things I need to remember:

- Buy coffee
- Call Jamie back
- Don't forget what happened last Friday.

Some things are better left unsaid.`,

      // Temporary photo gallery
      photos: ["🌅", "🌆", "🌙", "☕", "🌊", "📷"]

    };


    // =======================================
    // 12. UNLOCK PHONE
    // Hides the lock screen and shows home.
    // =======================================

    function unlockPhone() {

      document.getElementById("lock").style.display = "none";

      document.getElementById("home").style.display = "block";

    }


    // =======================================
    // 13. OPEN APPLICATION
    // Displays the selected application's UI.
    // =======================================

    function openApp(name) {

      const content = document.getElementById("appContent");

      // Hide home screen
      document.getElementById("home").style.display = "none";

      // Display application window
      document.getElementById("app").style.display = "block";


      // Define the contents of each application
      const apps = {

        // MESSAGES
        messages: `
          <h2>Messages</h2>
          <p>Recent conversations</p>

          ${character.messages.map(m => `
            <div class="chat">
              <b>${m[0]}</b><br>
              ${m[1]}
            </div>
          `).join("")}
        `,

        // NOTES
        notes: `
          <h2>Notes</h2>
          <p>All iCloud notes</p>

          <div class="note">${character.notes}</div>
        `,

        // PHOTOS
        photos: `
          <h2>Photos</h2>
          <p>Recent memories</p>

          <div class="photo-grid">
            ${character.photos.map(p => `
              <div class="photo">${p}</div>
            `).join("")}
          </div>
        `,

        // MUSIC
        music: `
          <h2>Music</h2>

          <div class="note">
            🎧 Currently listening

            Somewhere Only We Know

            Favorite playlist: Late Nights
          </div>
        `,

        // SOCIAL MEDIA
        social: `
          <h2>Social</h2>

          <div class="note">
            @alex

            Just another ordinary day.

            ❤️ 128 likes
          </div>
        `,

        // CALENDAR
        calendar: `
          <h2>Calendar</h2>

          <div class="note">
            November 5

            9:00 AM — Class

            2:00 PM — Meet Jamie

            8:00 PM — Call home
          </div>
        `,

        // SETTINGS
        settings: `
          <h2>Settings</h2>

          <div class="chat">✈️ Airplane Mode</div>
          <div class="chat">📶 Wi-Fi</div>
          <div class="chat">🔋 Battery</div>
          <div class="chat">👤 About ${character.name}</div>
        `

      };


      // Insert selected app into the screen
      content.innerHTML = apps[name] || "<h2>App not found</h2>";

    }


    // =======================================
    // 14. RETURN TO HOME SCREEN
    // Closes the currently opened application.
    // =======================================

    function goHome() {

      document.getElementById("app").style.display = "none";

      document.getElementById("home").style.display = "block";

    }


    // =======================================
    // 15. UPDATE CLOCK
    // Refreshes the time every 30 seconds.
    // =======================================

    function updateClock() {

      const now = new Date();

      // Format visitor's local time
      const time = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

      // Update lock screen clock
      document.getElementById("clock").textContent = time;

      // Update status bar clock
      document.getElementById("statusTime").textContent = time;

    }

    // Display clock immediately
    updateClock();

    // Refresh clock every 30 seconds
    setInterval(updateClock, 30000);

  </script>

</body>
</html>

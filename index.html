
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Jhoanna's Phone</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #20232b;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Helvetica Neue", sans-serif;
  color: white;
}

.phone {
  width: min(390px, 96vw);
  height: min(820px, 94dvh);
  min-height: 540px;
  background: #090909;
  border: 7px solid #333;
  border-radius: 48px;
  padding: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 25px 80px #0009;
}

.screen {
  width: 100%;
  height: 100%;
  border-radius: 34px;
  overflow: hidden;
  position: relative;
  background: #263747;
}
.status {
  height: 42px;
  padding: 12px 25px 0;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 650;
  position: relative;
  z-index: 15;
  pointer-events: none;
}
.dynamic-island {
  position: absolute;
  width: 105px;
  height: 28px;
  border-radius: 20px;
  background: #000;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  z-index: 20;
}
.lock,                    /* lockscreen formatting */
.passcode,
.home,
.app {
  position: absolute;
  inset: 42px 0 0;
}
.lock {
  text-align: center;
  padding-top: 75px;
  background:
    linear-gradient(160deg, #607d95aa, #11182755),
    linear-gradient(160deg, #536c83, #263747 48%, #171c29);
}
.lock-date {
  font-size: 16px;
  font-weight: 500;
}
.clock {
  font-size: 76px;
  font-weight: 300;
  letter-spacing: -4px;
  margin-top: 8px;
  line-height: 1.1;
}
.swipe-area {            /* swipe to unlock feature */
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  height: 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.swipe-text {
  font-size: 11px;
  font-weight: 500;
  color: #ffffffc9;
  letter-spacing: .2px;
}
.swipe-line {
  width: 35px;
  height: 4px;
  border-radius: 10px;
  background: #ffffffd9;
}
.lock-shortcuts {              /* lockscreen shortcuts - flashlight and camera */
  position: absolute;
  bottom: 28px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.lock-shortcut {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #0005;
  border: 1px solid #ffffff35;
  display: grid;
  place-items: center;
  font-size: 19px;
}

/* PASSCODE SCREEN */

.passcode {
  display: none;
  text-align: center;
  padding-top: 45px;
  background: linear-gradient(160deg, #536c83, #263747 48%, #171c29);
  z-index: 4;
}

.passcode-title {
  font-size: 23px;
  font-weight: 600;
  margin-bottom: 9px;
}

.passcode-subtitle {
  font-size: 14px;
  color: #ffffffc9;
}

.passcode-dots {
  display: flex;
  justify-content: center;
  gap: 19px;
  margin: 27px 0 17px;
}

.passcode-dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.passcode-dot.filled {
  background: white;
}

.passcode-error {
  height: 20px;
  font-size: 12px;
  color: #ffb7b7;
  margin-bottom: 12px;
}

.keypad {
  width: 240px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px 18px;
}

.key {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 1px solid #ffffff25;
  background: #ffffff20;
  color: white;
  font-size: 27px;
  font-weight: 400;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}

.key:active {
  background: #ffffff55;
}

.key small {
  font-size: 8px;
  letter-spacing: 1px;
  margin-top: -2px;
}

.key.empty {
  visibility: hidden;
}

.key.delete {
  background: transparent;
  border: none;
  font-size: 19px;
}

.passcode-cancel {
  position: absolute;
  bottom: 38px;
  left: 0;
  right: 0;
  background: none;
  color: white;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

/* HOME SCREEN */

.home {
  display: none;
  padding: 22px 17px 65px;
  background: linear-gradient(150deg, #596c7d, #273647 55%, #171e2c);
}

.welcome {
  font-size: 14px;
  margin: 10px 3px 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px 10px;
}

.app-icon {
  border: 0;
  background: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  cursor: pointer;
}

.emoji {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 29px;
  background: #ffffff25;
  box-shadow: 0 3px 9px #0003;
  backdrop-filter: blur(12px);
}

.dock {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  height: 85px;
  border-radius: 25px;
  background: #ffffff25;
  backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

/* APPLICATION WINDOWS */

.app {
  display: none;
  background: #f5f5f7;
  color: #161616;
  padding: 20px;
  overflow-y: auto;
  z-index: 5;
}

.app h2 {
  font-size: 27px;
}

.app button {
  cursor: pointer;
  border: 0;
}

.back {
  color: #287bea;
  background: none;
  font-size: 15px;
  padding: 8px 0;
}

.chat {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin: 10px 0;
  font-size: 14px;
}

.note {
  background: #fff4bb;
  padding: 18px;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.photo {
  height: 135px;
  border-radius: 12px;
  background: linear-gradient(140deg, #9aaaba, #43586c);
  display: grid;
  place-items: center;
  font-size: 30px;
}

/* HOME INDICATOR */

.home-indicator {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 4px;
  background: white;
  border-radius: 5px;
  z-index: 25;
  cursor: pointer;
}

@media (max-height: 650px) {
  .home {
    padding-top: 10px;
  }

  .grid {
    gap: 12px 8px;
  }

  .emoji {
    width: 44px;
    height: 44px;
  }

  .passcode {
    padding-top: 20px;
  }

  .keypad {
    gap: 7px 15px;
  }

  .key {
    width: 55px;
    height: 55px;
  }
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <div class="dynamic-island"></div>

    <div class="status">
      <span id="statusTime">9:41</span>
      <span>●●●  Wi-Fi  ▰</span>
    </div>

    <!-- LOCK SCREEN -->

    <section class="lock" id="lock">

      <div class="lock-date" id="lockDate">
        Thursday, November 5
      </div>

      <div class="clock" id="clock">9:41</div>

      <div class="lock-shortcuts">
        <div class="lock-shortcut">🔦</div>
        <div class="lock-shortcut">📷</div>
      </div>

      <!-- Swipe upward in this area -->

      <div class="swipe-area" id="swipeArea">
        <div class="swipe-text">Swipe up to unlock</div>
        <div class="swipe-line"></div>
      </div>

    </section>

    <!-- PASSCODE SCREEN -->

    <section class="passcode" id="passcode">

      <div class="passcode-title">Enter Passcode</div>

      <div class="passcode-subtitle">
        Enter your passcode to unlock iPhone
      </div>

      <div class="passcode-dots" id="passcodeDots">
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
      </div>

      <div class="passcode-error" id="passcodeError"></div>

      <div class="keypad">

        <button class="key" onclick="enterDigit('1')">
          1
        </button>

        <button class="key" onclick="enterDigit('2')">
          2<small>ABC</small>
        </button>

        <button class="key" onclick="enterDigit('3')">
          3<small>DEF</small>
        </button>

        <button class="key" onclick="enterDigit('4')">
          4<small>GHI</small>
        </button>

        <button class="key" onclick="enterDigit('5')">
          5<small>JKL</small>
        </button>

        <button class="key" onclick="enterDigit('6')">
          6<small>MNO</small>
        </button>

        <button class="key" onclick="enterDigit('7')">
          7<small>PQRS</small>
        </button>

        <button class="key" onclick="enterDigit('8')">
          8<small>TUV</small>
        </button>

        <button class="key" onclick="enterDigit('9')">
          9<small>WXYZ</small>
        </button>

        <button class="key empty"></button>

        <button class="key" onclick="enterDigit('0')">
          0
        </button>

        <button class="key delete" onclick="deleteDigit()">
          ⌫
        </button>

      </div>

      <button class="passcode-cancel" onclick="cancelPasscode()">
        Cancel
      </button>

    </section>

    <!-- HOME SCREEN -->

    <section class="home" id="home">

      <div class="welcome">Good morning ☁️</div>

      <div class="grid">

        <button class="app-icon" onclick="openApp('messages')">
          <span class="emoji">💬</span>
          Messages
        </button>

        <button class="app-icon" onclick="openApp('photos')">
          <span class="emoji">🌄</span>
          Photos
        </button>

        <button class="app-icon" onclick="openApp('notes')">
          <span class="emoji">📝</span>
          Notes
        </button>

        <button class="app-icon" onclick="openApp('music')">
          <span class="emoji">🎵</span>
          Music
        </button>

        <button class="app-icon" onclick="openApp('social')">
          <span class="emoji">📷</span>
          Social
        </button>

        <button class="app-icon" onclick="openApp('calendar')">
          <span class="emoji">📅</span>
          Calendar
        </button>

        <button class="app-icon" onclick="openApp('settings')">
          <span class="emoji">⚙️</span>
          Settings
        </button>

      </div>

      <div class="dock">

        <button class="app-icon" onclick="openApp('messages')">
          <span class="emoji">💬</span>
        </button>

        <button class="app-icon" onclick="openApp('photos')">
          <span class="emoji">📸</span>
        </button>

        <button class="app-icon" onclick="openApp('music')">
          <span class="emoji">🎧</span>
        </button>

      </div>

    </section>

    <!-- APPLICATION WINDOW -->

    <section class="app" id="app">

      <button class="back" onclick="goHome()">
        ‹ Home
      </button>

      <div id="appContent"></div>

    </section>

    <div class="home-indicator" onclick="goHome()"></div>

  </div>
</div>


<script>

// CHARACTER INFORMATION

const character = {

  name: "Alex",

  messages: [
    ["Jamie", "Are you awake?"],
    ["Alex", "Unfortunately."],
    ["Jamie", "We need to talk."],
    ["Alex", "About what?"],
    ["Jamie", "You know exactly what."]
  ],

  notes: `Things I need to remember:

- Buy coffee
- Call Jamie back
- Don't forget what happened last Friday.

Some things are better left unsaid.`,

  photos: ["🌅", "🌆", "🌙", "☕", "🌊", "📷"]

};


// PASSCODE CONFIGURATION

const correctPasscode = "0126";
let enteredPasscode = "";


// SWIPE TO PASSCODE

const swipeArea = document.getElementById("swipeArea");

let touchStartY = 0;
let touchStartX = 0;

swipeArea.addEventListener("pointerdown", function(e) {
  touchStartY = e.clientY;
  touchStartX = e.clientX;
});

swipeArea.addEventListener("pointerup", function(e) {

  const differenceY = touchStartY - e.clientY;
  const differenceX = Math.abs(touchStartX - e.clientX);

  // Detect upward swipe

  if (differenceY > 35 && differenceX < 80) {
    showPasscode();
  }

});


// SHOW PASSCODE SCREEN

function showPasscode() {

  document.getElementById("lock").style.display = "none";

  document.getElementById("passcode").style.display = "block";

  enteredPasscode = "";

  updatePasscodeDots();

  document.getElementById("passcodeError").textContent = "";

}


// CANCEL PASSCODE

function cancelPasscode() {

  document.getElementById("passcode").style.display = "none";

  document.getElementById("lock").style.display = "block";

  enteredPasscode = "";

}


// ENTER PASSCODE DIGITS

function enterDigit(digit) {

  if (enteredPasscode.length >= 4) return;

  enteredPasscode += digit;

  updatePasscodeDots();

  if (enteredPasscode.length === 4) {

    setTimeout(checkPasscode, 180);

  }

}


// UPDATE PASSCODE DOTS

function updatePasscodeDots() {

  const dots = document.querySelectorAll(".passcode-dot");

  dots.forEach((dot, index) => {

    dot.classList.toggle(
      "filled",
      index < enteredPasscode.length
    );

  });

}


// DELETE LAST DIGIT

function deleteDigit() {

  enteredPasscode = enteredPasscode.slice(0, -1);

  updatePasscodeDots();

  document.getElementById("passcodeError").textContent = "";

}


// CHECK PASSCODE

function checkPasscode() {

  if (enteredPasscode === correctPasscode) {

    document.getElementById("passcode").style.display = "none";

    document.getElementById("home").style.display = "block";

    enteredPasscode = "";

  } else {

    document.getElementById("passcodeError").textContent =
      "Incorrect passcode. Try again.";

    enteredPasscode = "";

    setTimeout(updatePasscodeDots, 350);

  }

}


// OPEN APPLICATION

function openApp(name) {

  const content = document.getElementById("appContent");

  document.getElementById("home").style.display = "none";

  document.getElementById("app").style.display = "block";

  const apps = {

    messages: `
      <h2>Messages</h2>
      <p>Recent conversations</p>

      ${character.messages.map(m => `
        <div class="chat">
          <b>${m[0]}</b><br>
          ${m[1]}
        </div>
      `).join("")}
    `,

    notes: `
      <h2>Notes</h2>
      <p>All iCloud notes</p>

      <div class="note">${character.notes}</div>
    `,

    photos: `
      <h2>Photos</h2>
      <p>Recent memories</p>

      <div class="photo-grid">
        ${character.photos.map(p => `
          <div class="photo">${p}</div>
        `).join("")}
      </div>
    `,

    music: `
      <h2>Music</h2>

      <div class="note">
        🎧 Currently listening

        Somewhere Only We Know

        Favorite playlist: Late Nights
      </div>
    `,

    social: `
      <h2>Social</h2>

      <div class="note">
        @alex

        Just another ordinary day.

        ❤️ 128 likes
      </div>
    `,

    calendar: `
      <h2>Calendar</h2>

      <div class="note">
        November 5

        9:00 AM — Class

        2:00 PM — Meet Jamie

        8:00 PM — Call home
      </div>
    `,

    settings: `
      <h2>Settings</h2>

      <div class="chat">✈️ Airplane Mode</div>
      <div class="chat">📶 Wi-Fi</div>
      <div class="chat">🔋 Battery</div>
      <div class="chat">👤 About ${character.name}</div>
    `

  };

  content.innerHTML = apps[name] || "<h2>App not found</h2>";

}


// RETURN TO HOME SCREEN

function goHome() {

  document.getElementById("app").style.display = "none";

  document.getElementById("home").style.display = "block";

}


// UPDATE CLOCK AND DATE

function updateClock() {

  const now = new Date();

  const time = now.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  const date = now.toLocaleDateString("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric"
  });

  document.getElementById("clock").textContent = time;

  document.getElementById("statusTime").textContent = time;

  document.getElementById("lockDate").textContent = date;

}

updateClock();

setInterval(updateClock, 30000);

</script>

</body>
</html>
